
name: Build Telugu AI Academy APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/android@6.1.2
          npm install -D @capacitor/cli@6.1.2
          mkdir -p www
          cp index.html www/index.html
          npx cap init "Telugu AI Academy" com.teluguaia.academy --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telugu-AI-Academy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

